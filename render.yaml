databases:
  - name: invoicely-db
    plan: free
    databaseName: invoicely
    user: invoicely

services:
  - type: web
    name: invoicely
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: invoicely-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: invoicely-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: invoicely-db
          property: password
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_PLAN_ID
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
