spring:
  application:
    name: invoicely

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  thymeleaf:
    cache: false

server:
  port: 9080

app:
  upload-dir: ./uploads
  gst:
    default-rate: 18.00

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
  key-secret: ${RAZORPAY_KEY_SECRET:placeholder}
  plan-id: ${RAZORPAY_PLAN_ID:plan_placeholder}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:placeholder}
