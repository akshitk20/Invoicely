<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Suppliers</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Suppliers</h2>
        <a th:href="@{/suppliers/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Add Supplier
        </a>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Business Name</th>
                        <th>State</th>
                        <th>GSTIN</th>
                        <th>Email</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="supplier : ${suppliers}">
                        <td th:text="${supplier.name}">Name</td>
                        <td th:text="${supplier.businessName ?: '-'}">Business</td>
                        <td th:text="${supplier.state}">State</td>
                        <td th:text="${supplier.gstin ?: '-'}">GSTIN</td>
                        <td th:text="${supplier.email ?: '-'}">Email</td>
                        <td>
                            <form th:action="@{/suppliers/{id}/delete(id=${supplier.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this supplier?')">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(suppliers)}">
                        <td colspan="6" class="text-center text-muted py-4">No suppliers added yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
