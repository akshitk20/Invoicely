<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Products</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Products</h2>
        <a th:href="@{/products/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Add Product
        </a>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>HSN</th>
                        <th>Unit</th>
                        <th>Selling Price</th>
                        <th>Stock</th>
                        <th>Threshold</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="product : ${products}" th:classappend="${product.currentStock.compareTo(product.lowStockThreshold) <= 0 ? 'table-warning' : ''}">
                        <td th:text="${product.name}">Product</td>
                        <td th:text="${product.hsnCode ?: '-'}">-</td>
                        <td th:text="${product.unit.displayName}">PCS</td>
                        <td th:text="${product.sellingPrice != null ? '₹' + #numbers.formatDecimal(product.sellingPrice, 1, 2) : '-'}">-</td>
                        <td>
                            <span th:text="${product.currentStock}">0</span>
                            <span th:if="${product.currentStock.compareTo(product.lowStockThreshold) <= 0}" class="badge bg-danger ms-1">Low</span>
                        </td>
                        <td th:text="${product.lowStockThreshold}">10</td>
                        <td>
                            <form th:action="@{/products/{id}/delete(id=${product.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this product?')">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(products)}">
                        <td colspan="7" class="text-center text-muted py-4">No products added yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
