<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Add Product</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="mb-4">Add Product</h2>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/products}" method="post">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Product Name *</label>
                        <input type="text" name="name" class="form-control" required placeholder="e.g., Steel Rod 12mm">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">HSN Code</label>
                        <input type="text" name="hsnCode" class="form-control" placeholder="e.g., 7213">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Unit *</label>
                        <select name="unit" class="form-select" required>
                            <option th:each="u : ${units}" th:value="${u}" th:text="${u.displayName}">Unit</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Selling Price (₹)</label>
                        <input type="number" name="sellingPrice" class="form-control" step="0.01" min="0" placeholder="0.00">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Purchase Price (₹)</label>
                        <input type="number" name="purchasePrice" class="form-control" step="0.01" min="0" placeholder="0.00">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Opening Stock</label>
                        <input type="number" name="currentStock" class="form-control" step="0.01" min="0" value="0">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Low Stock Alert At</label>
                        <input type="number" name="lowStockThreshold" class="form-control" step="0.01" min="0" value="10">
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Save Product</button>
                    <a th:href="@{/products}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
