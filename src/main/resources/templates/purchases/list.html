<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Purchases</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Purchase Invoices</h2>
        <a th:href="@{/purchases/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> New Purchase
        </a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>Invoice #</th>
                        <th>Supplier</th>
                        <th>Date</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="purchase : ${purchases}">
                        <td>
                            <a th:href="@{/purchases/{id}(id=${purchase.id})}" th:text="${purchase.invoiceNumber ?: '-'}">INV</a>
                        </td>
                        <td th:text="${purchase.supplier.name}">Supplier</td>
                        <td th:text="${purchase.invoiceDate}">2026-01-01</td>
                        <td th:text="'₹' + ${#numbers.formatDecimal(purchase.total, 1, 2)}">₹0</td>
                        <td>
                            <span class="badge" th:classappend="${purchase.status.name() == 'PAID' ? 'bg-success' : 'bg-warning'}" th:text="${purchase.status}">UNPAID</span>
                        </td>
                        <td>
                            <a th:if="${purchase.status.name() != 'PAID'}" th:href="@{/purchases/{id}/edit(id=${purchase.id})}" class="btn btn-sm btn-outline-primary me-1" title="Edit">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/purchases/{id}/pdf(id=${purchase.id})}" class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-download"></i>
                            </a>
                            <form th:if="${purchase.status.name() == 'UNPAID'}" th:action="@{/purchases/{id}/mark-paid(id=${purchase.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-success">
                                    <i class="bi bi-check-lg"></i> Paid
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(purchases)}">
                        <td colspan="6" class="text-center text-muted py-4">No purchase invoices yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
