<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Purchase Invoice</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="'Purchase: ' + (${purchase.invoiceNumber} ?: 'N/A')">Purchase Invoice</h2>
        <a th:href="@{/purchases}" class="btn btn-outline-secondary">Back to List</a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="row mb-4">
                <div class="col-md-6">
                    <h6>Supplier:</h6>
                    <p class="mb-0" th:text="${purchase.supplier.name}">Supplier</p>
                    <p class="mb-0 text-muted" th:text="${purchase.supplier.businessName}">Business</p>
                    <p class="mb-0 text-muted" th:text="'State: ' + ${purchase.supplier.state}">State</p>
                    <p class="mb-0 text-muted" th:text="'GSTIN: ' + (${purchase.supplier.gstin} ?: 'N/A')">GSTIN</p>
                </div>
                <div class="col-md-6 text-end">
                    <p class="mb-1"><strong>Date:</strong> <span th:text="${purchase.invoiceDate}">Date</span></p>
                    <p class="mb-1"><strong>Status:</strong>
                        <span class="badge" th:classappend="${purchase.status.name() == 'PAID' ? 'bg-success' : 'bg-warning'}" th:text="${purchase.status}">UNPAID</span>
                    </p>
                </div>
            </div>

            <table class="table">
                <thead>
                    <tr>
                        <th>Description</th>
                        <th>HSN</th>
                        <th>Qty</th>
                        <th>Rate</th>
                        <th class="text-end">Amount</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${purchase.lineItems}">
                        <td th:text="${item.description}">Item</td>
                        <td th:text="${item.hsnCode ?: '-'}">-</td>
                        <td th:text="${item.quantity}">1</td>
                        <td th:text="${item.rate}">0</td>
                        <td class="text-end" th:text="${item.amount}">0</td>
                    </tr>
                </tbody>
            </table>

            <div class="row justify-content-end">
                <div class="col-md-4">
                    <table class="table table-sm">
                        <tr>
                            <td>Subtotal</td>
                            <td class="text-end" th:text="'₹' + ${#numbers.formatDecimal(purchase.subtotal, 1, 2)}">₹0</td>
                        </tr>
                        <tr th:if="${purchase.cgst.compareTo(T(java.math.BigDecimal).ZERO) > 0}">
                            <td>CGST</td>
                            <td class="text-end" th:text="'₹' + ${#numbers.formatDecimal(purchase.cgst, 1, 2)}">₹0</td>
                        </tr>
                        <tr th:if="${purchase.sgst.compareTo(T(java.math.BigDecimal).ZERO) > 0}">
                            <td>SGST</td>
                            <td class="text-end" th:text="'₹' + ${#numbers.formatDecimal(purchase.sgst, 1, 2)}">₹0</td>
                        </tr>
                        <tr th:if="${purchase.igst.compareTo(T(java.math.BigDecimal).ZERO) > 0}">
                            <td>IGST</td>
                            <td class="text-end" th:text="'₹' + ${#numbers.formatDecimal(purchase.igst, 1, 2)}">₹0</td>
                        </tr>
                        <tr class="fw-bold">
                            <td>Total</td>
                            <td class="text-end" th:text="'₹' + ${#numbers.formatDecimal(purchase.total, 1, 2)}">₹0</td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
