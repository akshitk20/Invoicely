<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Setup Your Business</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">Setup Your Business Profile</h4>
                    <small class="text-muted">This information will appear on your invoices</small>
                </div>
                <div class="card-body">
                    <form th:action="@{/onboarding}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Business Name *</label>
                            <input type="text" name="businessName" class="form-control" required
                                   placeholder="e.g., Rahul Sharma Consulting">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Address *</label>
                            <textarea name="address" class="form-control" rows="2" required
                                      placeholder="Your business address"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">State *</label>
                            <select name="state" class="form-select" required>
                                <option value="">Select State</option>
                                <option value="Andhra Pradesh">Andhra Pradesh</option>
                                <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                                <option value="Assam">Assam</option>
                                <option value="Bihar">Bihar</option>
                                <option value="Chhattisgarh">Chhattisgarh</option>
                                <option value="Goa">Goa</option>
                                <option value="Gujarat">Gujarat</option>
                                <option value="Haryana">Haryana</option>
                                <option value="Himachal Pradesh">Himachal Pradesh</option>
                                <option value="Jharkhand">Jharkhand</option>
                                <option value="Karnataka">Karnataka</option>
                                <option value="Kerala">Kerala</option>
                                <option value="Madhya Pradesh">Madhya Pradesh</option>
                                <option value="Maharashtra">Maharashtra</option>
                                <option value="Manipur">Manipur</option>
                                <option value="Meghalaya">Meghalaya</option>
                                <option value="Mizoram">Mizoram</option>
                                <option value="Nagaland">Nagaland</option>
                                <option value="Odisha">Odisha</option>
                                <option value="Punjab">Punjab</option>
                                <option value="Rajasthan">Rajasthan</option>
                                <option value="Sikkim">Sikkim</option>
                                <option value="Tamil Nadu">Tamil Nadu</option>
                                <option value="Telangana">Telangana</option>
                                <option value="Tripura">Tripura</option>
                                <option value="Uttar Pradesh">Uttar Pradesh</option>
                                <option value="Uttarakhand">Uttarakhand</option>
                                <option value="West Bengal">West Bengal</option>
                                <option value="Delhi">Delhi</option>
                                <option value="Chandigarh">Chandigarh</option>
                                <option value="Puducherry">Puducherry</option>
                                <option value="Jammu and Kashmir">Jammu and Kashmir</option>
                                <option value="Ladakh">Ladakh</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">GSTIN</label>
                            <input type="text" name="gstin" class="form-control" maxlength="15"
                                   placeholder="e.g., 27AABCU9603R1ZM" pattern="[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}">
                            <small class="text-muted">15-character GST Identification Number</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">PAN</label>
                            <input type="text" name="pan" class="form-control" maxlength="10"
                                   placeholder="e.g., AABCU9603R" pattern="[A-Z]{5}[0-9]{4}[A-Z]{1}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Default SAC Code</label>
                            <input type="text" name="defaultSacCode" class="form-control" maxlength="10"
                                   placeholder="e.g., 998314 (IT Consulting)">
                            <small class="text-muted">Service Accounting Code for your primary service</small>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100">Save & Continue</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
