<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Log Expense</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-4">Log Expense</h2>

            <div class="card">
                <div class="card-body">
                    <form th:action="@{/expenses}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label">Date *</label>
                            <input type="date" name="expenseDate" class="form-control" required
                                   th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Amount (₹) *</label>
                            <input type="number" name="amount" class="form-control" step="0.01" min="0.01" required
                                   placeholder="e.g., 750">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category *</label>
                            <select name="category" class="form-select" required>
                                <option value="">Select Category</option>
                                <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.displayName}">Category</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <input type="text" name="description" class="form-control"
                                   placeholder="e.g., GitHub Pro annual subscription">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Receipt (optional)</label>
                            <input type="file" name="receipt" class="form-control" accept="image/*,.pdf">
                            <small class="text-muted">Upload receipt image or PDF (max 5MB)</small>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Save Expense</button>
                            <a th:href="@{/expenses}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
