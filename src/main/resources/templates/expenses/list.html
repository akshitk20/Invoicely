<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Expenses</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Expenses</h2>
        <a th:href="@{/expenses/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Log Expense
        </a>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Category</th>
                        <th>Description</th>
                        <th>Amount</th>
                        <th>Receipt</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="expense : ${expenses}">
                        <td th:text="${expense.expenseDate}">2026-01-01</td>
                        <td th:text="${expense.category.displayName}">Category</td>
                        <td th:text="${expense.description}">Description</td>
                        <td th:text="'₹' + ${#numbers.formatDecimal(expense.amount, 1, 2)}">₹0</td>
                        <td>
                            <span th:if="${expense.receiptPath != null}" class="badge bg-info">Attached</span>
                            <span th:if="${expense.receiptPath == null}" class="text-muted">-</span>
                        </td>
                        <td>
                            <form th:action="@{/expenses/{id}/delete(id=${expense.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this expense?')">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(expenses)}">
                        <td colspan="6" class="text-center text-muted py-4">No expenses logged yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
