<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#212529">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Invoicely">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="manifest" th:href="@{/manifest.json}">
    <link rel="apple-touch-icon" th:href="@{/icons/icon-192.png}">
    <title layout:title-pattern="$CONTENT_TITLE - Invoicely">Invoicely</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" sec:authorize="isAuthenticated()">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/dashboard}">Invoicely</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/invoices}"><i class="bi bi-receipt"></i> Sales</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/purchases}"><i class="bi bi-cart-dash"></i> Purchases</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-gear"></i> Manage
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" th:href="@{/products}"><i class="bi bi-box-seam"></i> Products</a></li>
                            <li><a class="dropdown-item" th:href="@{/clients}"><i class="bi bi-people"></i> Clients</a></li>
                            <li><a class="dropdown-item" th:href="@{/suppliers}"><i class="bi bi-truck"></i> Suppliers</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" th:href="@{/import}"><i class="bi bi-cloud-upload"></i> Bulk Import <span class="badge bg-success">PRO</span></a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/reports}"><i class="bi bi-file-earmark-bar-graph"></i> Reports</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item" th:if="${subscriptionTier == 'PRO'}">
                        <span class="nav-link"><span class="badge bg-success">PRO</span></span>
                    </li>
                    <li class="nav-item" th:if="${subscriptionTier != 'PRO'}">
                        <a class="nav-link text-warning" th:href="@{/subscription/pricing}"><i class="bi bi-star-fill"></i> Upgrade</a>
                    </li>
                    <li class="nav-item">
                        <span class="nav-link text-light" th:text="${#authentication.principal.attributes['name'] ?: #authentication.principal.attributes['email']}"></span>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/logout}"><i class="bi bi-box-arrow-right"></i> Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <main class="container py-4">
        <div layout:fragment="content"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-light py-3 mt-5" sec:authorize="isAuthenticated()">
        <div class="container text-center text-muted">
            <small>Invoicely - GST Invoicing for Indian Businesses</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
